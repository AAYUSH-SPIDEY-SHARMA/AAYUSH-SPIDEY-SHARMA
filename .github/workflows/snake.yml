name: Update profile assets

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Must run first: actions/checkout cleans the workspace, so it would wipe
      # dist/ if it ran after the generators below.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=#E5202B&color_dots=#161B22,#4a1015,#8b1a22,#c21c28,#E5202B

      - name: Generate caffeine-free counter
        run: python3 .github/scripts/streak_svg.py dist/streak.svg

      # Publishes the whole dist/ directory, replacing the branch contents —
      # which is why both SVGs must be generated into dist/ in this one job.
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
